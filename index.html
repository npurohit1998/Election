<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>लोर्डिया ग्राम पंचायत — Campaign Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lordiya Tracker">
  <meta name="theme-color" content="#1E2A4A">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="login-view" class="view">
    <div class="card">
      <h1>लोर्डिया ग्राम पंचायत</h1>
      <p class="lede">Campaign tracker — family access only</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Sign in</button>
      </form>

      <p id="login-status" role="status"></p>
    </div>
  </section>

  <section id="app-view" class="view" hidden>
    <header>
      <h1>लोर्डिया ग्राम पंचायत</h1>
      <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn" class="ghost">Sign out</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="search-tab">Search</button>
      <button class="tab-btn" data-tab="families-tab">Families</button>
      <button class="tab-btn" data-tab="groups-tab">Groups</button>
      <button class="tab-btn" id="dashboard-tab-btn" data-tab="dashboard-tab" hidden>Dashboard</button>
      <button class="tab-btn" id="import-tab-btn" data-tab="import-tab" hidden>Import data</button>
    </nav>

    <main>
      <section id="search-tab" class="tab-panel voters-card">
        <div class="search-row">
          <input type="search" id="voter-search" placeholder="Name, house number, or Voter ID">
          <select id="ward-filter"><option value="">All wards</option></select>
          <select id="locality-filter"><option value="">All localities</option></select>
        </div>
        <div id="voter-count" class="voter-count"></div>
        <div id="voter-list" class="voter-list"></div>
      </section>

      <section id="families-tab" class="tab-panel" hidden>
        <div id="family-main">
          <div class="search-row"><input type="search" id="family-search" placeholder="Surname, name, house number or locality"></div>
          <div id="family-count" class="voter-count"></div>
          <div id="family-list" class="voter-list"></div>
        </div>
        <div id="family-detail" hidden></div>
      </section>

      <section id="groups-tab" class="tab-panel" hidden>
        <div id="groups-main">
          <button id="new-group-btn" class="visit-btn" type="button">+ New group</button>
          <div id="groups-list" class="voter-list"></div>
        </div>
        <div id="group-detail" hidden></div>
      </section>

      <section id="dashboard-tab" class="tab-panel" hidden>
        <div id="dash-root"></div>
      </section>

      <section id="import-tab" class="tab-panel" hidden>
        <p class="lede">Upload each ward's Excel file (with photos). Re-importing a ward updates its voters — nothing is duplicated, and support levels, visits and voted marks are kept.</p>
        <div id="ward-import-list"></div>
      </section>
    </main>
  </section>

  <section id="detail-view" class="view" hidden>
    <header>
      <button id="back-btn" class="ghost">← Back</button>
      <div class="who">
        <span id="detail-user-name"></span>
      </div>
    </header>
    <main id="voter-detail"></main>
  </section>

  <template id="voter-row-template">
    <button class="voter-row">
      <img class="voter-thumb" alt="" loading="lazy" decoding="async">
      <div class="voter-row-info">
        <div class="voter-row-name"></div>
        <div class="voter-row-meta"></div>
      </div>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
  <script src="import.js"></script>
  <script src="voters.js"></script>
  <script src="groups.js"></script>
  <script src="dashboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => (p.hidden = true));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).hidden = false;
        btn.scrollIntoView({ inline: 'center', block: 'nearest' });
        window.scrollTo(0, 0);
      });
    });
  </script>
</body>
</html>
