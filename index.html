<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लोर्डिया वार्ड 6 — Campaign Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E2A4A">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="login-view" class="view">
    <div class="card">
      <h1>लोर्डिया वार्ड 6</h1>
      <p class="lede">Campaign tracker — family access only</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Sign in</button>
      </form>

      <p id="login-status" role="status"></p>
    </div>
  </section>

  <section id="app-view" class="view" hidden>
    <header>
      <h1>लोर्डिया वार्ड 6</h1>
      <div class="who">
        <span id="user-name"></span>
        <button id="signout-btn" class="ghost">Sign out</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="search-tab">Search</button>
      <button class="tab-btn" id="import-tab-btn" data-tab="import-tab" hidden>Import data</button>
    </nav>

    <main>
      <section id="search-tab" class="tab-panel voters-card">
        <div class="search-row">
          <input type="search" id="voter-search" placeholder="Name, house number, or Voter ID">
          <select id="locality-filter"><option value="">All localities</option></select>
        </div>
        <div id="voter-count" class="voter-count"></div>
        <div id="voter-list" class="voter-list"></div>
      </section>

      <section id="import-tab" class="tab-panel card import-card" hidden>
        <h2>Import ward data</h2>
        <p class="lede">Upload a ward's extracted Excel file (with photos) to load it into the shared database. Safe to re-run — existing voters are updated, not duplicated.</p>
        <input type="file" id="import-file" accept=".xlsx">
        <button id="import-btn">Import</button>
        <div id="import-progress" role="status"></div>
      </section>
    </main>
  </section>

  <section id="detail-view" class="view" hidden>
    <header>
      <button id="back-btn" class="ghost">← Back</button>
      <div class="who">
        <span id="detail-user-name"></span>
      </div>
    </header>
    <main id="voter-detail"></main>
  </section>

  <template id="voter-row-template">
    <button class="voter-row">
      <img class="voter-thumb" alt="">
      <div class="voter-row-info">
        <div class="voter-row-name"></div>
        <div class="voter-row-meta"></div>
      </div>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
  <script src="import.js"></script>
  <script src="voters.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => (p.hidden = true));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).hidden = false;
      });
    });
  </script>
</body>
</html>
